-- HTML/CSS UI para Battle Pass y Mapa
-- Coloca este contenido en resources/[qb]/qb-zombierp/html/index.html

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ZombieRP UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            overflow: hidden;
        }

        /* Battle Pass Styles */
        .battlepass-container {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            display: flex;
            flex-direction: column;
            padding: 40px;
            overflow-y: auto;
        }

        .bp-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #ff6b00;
            padding-bottom: 20px;
        }

        .bp-header h1 {
            font-size: 3em;
            color: #ff6b00;
            text-shadow: 0 0 20px rgba(255, 107, 0, 0.8);
            margin-bottom: 15px;
        }

        .bp-info {
            display: flex;
            justify-content: center;
            gap: 60px;
            font-size: 1.3em;
            font-weight: bold;
        }

        .bp-info span {
            background: rgba(255, 107, 0, 0.2);
            padding: 10px 30px;
            border-radius: 5px;
            border: 2px solid #ff6b00;
        }

        .bp-levels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .bp-level-card {
            background: rgba(50, 50, 50, 0.7);
            border: 2px solid #444;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .bp-level-card.unlocked {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .bp-level-card.locked {
            opacity: 0.6;
            border-color: #666;
        }

        .bp-level-card.claimed {
            background: rgba(0, 255, 0, 0.15);
            border-color: #00cc00;
        }

        .level-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #ff6b00;
            margin-bottom: 10px;
        }

        .reward-info {
            font-size: 1.1em;
            margin-bottom: 15px;
            color: #fff;
        }

        .bp-level-card button {
            background: linear-gradient(135deg, #ff6b00, #ff8c00);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .bp-level-card button:hover {
            background: linear-gradient(135deg, #ff8c00, #ffaa00);
            box-shadow: 0 0 10px rgba(255, 107, 0, 0.8);
        }

        .claimed-badge {
            color: #00ff00;
            font-weight: bold;
        }

        .bp-premium-offer {
            background: linear-gradient(135deg, #ff6b00, #ff8c00);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-top: 30px;
        }

        .bp-premium-offer h3 {
            font-size: 2em;
            margin-bottom: 15px;
        }

        .bp-premium-offer p {
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        .bp-premium-offer button {
            background: #fff;
            color: #ff6b00;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        .bp-premium-offer button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .bp-premium-status {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 30px;
            border: 2px solid #00ff00;
        }

        /* Map Styles */
        .map-container {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            padding: 40px;
            overflow-y: auto;
        }

        .map-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #00bfff;
            padding-bottom: 20px;
        }

        .map-header h1 {
            font-size: 3em;
            color: #00bfff;
            text-shadow: 0 0 20px rgba(0, 191, 255, 0.8);
        }

        .zones-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .zone-card {
            background: rgba(50, 50, 50, 0.7);
            border: 2px solid #444;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .zone-card.active {
            border-color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .zone-card.inactive {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.05);
        }

        .zone-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #00bfff;
            margin-bottom: 15px;
        }

        .zone-info {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .zone-info p {
            font-size: 1em;
            margin: 5px 0;
        }

        .status-badge {
            background: rgba(255, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 3px;
            color: #ff6666;
        }

        .zone-coords {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 15px;
        }

        .btn-teleport, .btn-waypoint {
            background: #00bfff;
            color: black;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .btn-teleport:hover, .btn-waypoint:hover {
            background: #00ffff;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="content"></div>

    <script>
        function claimReward(level) {
            fetch(`https://${GetParentResourceName()}/claimReward`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ level: level })
            });
        }

        function upgradePremium() {
            fetch(`https://${GetParentResourceName()}/upgradePremium`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
        }

        function teleportToZone(x, y, z) {
            fetch(`https://${GetParentResourceName()}/teleportToZone`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ x: x, y: y, z: z })
            });
        }

        function setWaypoint(x, y) {
            fetch(`https://${GetParentResourceName()}/setWaypoint`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ x: x, y: y })
            });
        }

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.action === 'openBattlePass') {
                document.getElementById('content').innerHTML = data.data;
            } else if (data.action === 'openMap') {
                document.getElementById('content').innerHTML = data.data;
            } else if (data.action === 'closeBattlePass' || data.action === 'closeMap') {
                document.getElementById('content').innerHTML = '';
            }
        });
    </script>
</body>
</html>
